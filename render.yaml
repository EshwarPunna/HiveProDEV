services:
  - type: web
    name: tawasolpay-risk
    env: python
    repo: https://github.com/EshwarPunna/HiveProDEV.git
    branch: main
    buildCommand: "pip install -r requirements-render.txt && python scripts/build_nist_index.py"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_PROVIDER
        value: none
